<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fastnet Billing</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f9;color:#172033}
header{background:#0b1730;color:white;padding:22px}
header h2{margin:0}
header p{margin:8px 0 0;color:#b7c8e0}
.container{padding:15px;max-width:700px;margin:auto}
.card{background:white;padding:18px;border-radius:15px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border-radius:14px;padding:16px;background:#fff}
.stat small{color:#64748b}
.stat h2{font-size:28px;margin:10px 0}
.green{color:#16a34a}.red{color:#dc2626}.blue{color:#2563eb}
button{border:0;background:#0b1730;color:white;padding:12px;border-radius:10px;font-size:15px}
input,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse}
td{padding:10px 5px;border-bottom:1px solid #eee;font-size:14px}
.badge{padding:5px 8px;border-radius:8px;font-size:12px}
.online{background:#dcfce7;color:#15803d}
.offline{background:#fee2e2;color:#dc2626}
</style>
</head>
<body>

<header>
<h2>FASTNET BILLING</h2>
<p>Panel pelanggan RT/RW Net</p>
</header>

<div class="container">

<div class="grid">
<div class="stat">
<small>Total Pelanggan</small>
<h2 id="total">0</h2>
</div>
<div class="stat">
<small>Online</small>
<h2 class="green" id="online">0</h2>
</div>
<div class="stat">
<small>Offline</small>
<h2 class="red" id="offline">0</h2>
</div>
<div class="stat">
<small>Lunas</small>
<h2 class="blue" id="lunas">0</h2>
</div>
</div>

<div class="card">
<h3>Tambah Pelanggan</h3>
<input id="nama" placeholder="Nama pelanggan">
<input id="user" placeholder="Username PPPoE">
<input id="harga" type="number" placeholder="Tagihan (Rp)">
<select id="status">
<option value="online">Online</option>
<option value="offline">Offline</option>
</select>
<button onclick="tambah()" style="width:100%">Tambah Pelanggan</button>
</div>

<div class="card">
<h3>Daftar Pelanggan</h3>
<input id="cari" placeholder="Cari pelanggan..." oninput="render()">
<div style="overflow-x:auto">
<table>
<tbody id="list"></tbody>
</table>
</div>
</div>

</div>

<script>
let data=JSON.parse(localStorage.getItem("fastnetdata")||"[]");

function simpan(){
localStorage.setItem("fastnetdata",JSON.stringify(data));
render();
}

function tambah(){
let n=document.getElementById("nama").value.trim();
let u=document.getElementById("user").value.trim();
let h=document.getElementById("harga").value;
let s=document.getElementById("status").value;

if(!n||!u||!h){
alert("Isi semua data!");
return;
}

data.push({nama:n,user:u,harga:Number(h),status:s,lunas:false});

document.getElementById("nama").value="";
document.getElementById("user").value="";
document.getElementById("harga").value="";

simpan();
}

function hapus(i){
if(confirm("Hapus pelanggan ini?")){
data.splice(i,1);
simpan();
}
}

function bayar(i){
data[i].lunas=!data[i].lunas;
simpan();
}

function render(){
let q=document.getElementById("cari").value.toLowerCase();
let filtered=data.map((x,i)=>({...x,i})).filter(x=>
x.nama.toLowerCase().includes(q)||x.user.toLowerCase().includes(q)
);

document.getElementById("total").innerText=data.length;
document.getElementById("online").innerText=data.filter(x=>x.status==="online").length;
document.getElementById("offline").innerText=data.filter(x=>x.status==="offline").length;
document.getElementById("lunas").innerText=data.filter(x=>x.lunas).length;

document.getElementById("list").innerHTML=filtered.map(x=>`
<tr>
<td>
<strong>${escapeHtml(x.nama)}</strong><br>
<small>${escapeHtml(x.user)}</small><br>
Rp ${x.harga.toLocaleString("id-ID")}<br>
<span class="badge ${x.status==="online"?"online":"offline"}">
${x.status.toUpperCase()}
</span>
<br>
<span class="${x.lunas?"green":"red"}">
${x.lunas?"LUNAS":"BELUM BAYAR"}
</span>
</td>
<td style="text-align:right">
<button onclick="bayar(${x.i})" style="margin-bottom:6px">
${x.lunas?"Batalkan":"Bayar"}
</button><br>
<button onclick="hapus(${x.i})" style="background:#dc2626">Hapus</button>
</td>
</tr>
`).join("");
}

function escapeHtml(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));
}

render();
</script>

</body>
</html>
